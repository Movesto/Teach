server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver — forces runtime DNS lookup so nginx
    # doesn't cache a failed resolution from startup before backend is ready.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:8000";

    # Serve React SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API, books, and audio to the backend service.
    # Using $backend variable (no path suffix) so nginx passes the full
    # original URI unchanged — avoids double-path issue with variable proxy_pass.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /books/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /audio/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
