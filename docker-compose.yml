version: '3.8'

services:
  qwen:
    image: vllm/vllm-openai:latest
    container_name: qwen-brain
    ports:
      - "8010:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host
    command: >
      --model Qwen/Qwen2.5-7B-Instruct-AWQ
      --quantization awq
      --max-model-len 4096
      --gpu-memory-utilization 0.70
      --enforce-eager
      --port 8000

  nllb:
    build: ./services/nllb
    container_name: nllb-translator
    ports:
      - "8001:8001"
    volumes:
      - C:/Users/pscad/Documents/somali-nllb-training/nllb-somali-english-v3:/app/model:ro
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host

volumes:
  huggingface-cache:
