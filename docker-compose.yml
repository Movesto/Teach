version: '3.8'

services:

  # ── AI Services ────────────────────────────────────────────────────────────

  qwen:
    image: vllm/vllm-openai:latest
    container_name: qwen-brain
    restart: unless-stopped
    ports:
      - "8010:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host
    command: >
      --model Qwen/Qwen2.5-3B-Instruct-AWQ
      --quantization awq
      --max-model-len 2048
      --gpu-memory-utilization 0.25
      --enforce-eager
      --port 8000
    networks:
      - teach-network

  nllb:
    build: ./services/nllb
    container_name: nllb-translator
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # ct2 = CTranslate2 int8 (~1.3 GB, ~2x faster). On first boot it merges the
      # LoRA into the base and converts to CT2 (cached in huggingface-cache).
      # Set to "transformers" for an instant rollback to fp16 base + LoRA.
      - NLLB_BACKEND=ct2
      - NLLB_CT2_QUANTIZATION=int8   # int8 (memory win) | float16 (lossless, less saving)
      - NLLB_DEVICE=auto             # auto | cuda | cpu (auto → CPU if CT2 lacks GPU kernels)
    volumes:
      - C:/Users/pscad/Documents/somali-nllb-training/nllb-somali-english-v3:/app/model:ro
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host
    healthcheck:
      # /health only responds once the startup event finishes — including the
      # one-time LoRA-merge + CT2 conversion on first boot. The long start_period
      # (+ retries) gives that conversion room before the container is marked
      # unhealthy; the backend waits on this via depends_on.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s
    networks:
      - teach-network

  pronunciation:
    image: teach-pronunciation
    container_name: teach-pronunciation
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - teach-network

  kokoro:
    build: ./services/kokoro
    container_name: kokoro-tts
    restart: unless-stopped
    ports:
      - "8880:8880"
    environment:
      - USE_GPU=false   # runs on CPU — same 82M model, identical audio, frees ~1.5 GB VRAM
    networks:
      - teach-network

  # ── Data ───────────────────────────────────────────────────────────────────

  database:
    image: postgres:16
    container_name: teach-database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/database/init-user-data-only.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teach-network

  # ── Application ────────────────────────────────────────────────────────────

  backend:
    build: ./backend
    container_name: teach-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # local access only — frontend nginx proxies internally
    environment:
      - DB_HOST=database
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - NLLB_URL=http://nllb-translator:8001/translate
      - QWEN_URL=http://qwen-brain:8000/v1/chat/completions
      - PRONUNCIATION_URL=http://teach-pronunciation:5002
      - KOKORO_URL=http://kokoro-tts:8880
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - ENVIRONMENT=production
    volumes:
      - ./backend/audio:/app/audio
      - ./backend/books:/app/books:ro
      - ./backend/unit-1:/app/unit-1:ro
      - ./backend/unit-2:/app/unit-2:ro
      - ./backend/unit-3:/app/unit-3:ro
      - ./backend/unit-4:/app/unit-4:ro
      - ./backend/unit-5:/app/unit-5:ro
      - ./backend/unit-6:/app/unit-6:ro
      - ./backend/unit-7:/app/unit-7:ro
      - ./backend/unit-8:/app/unit-8:ro
      - ./backend/unit-9:/app/unit-9:ro
      - ./backend/unit-10:/app/unit-10:ro
      - ./backend/unit-11:/app/unit-11:ro
      - ./backend/unit-12:/app/unit-12:ro
      - ./backend/unit-13:/app/unit-13:ro
      - ./backend/units.json:/app/units.json:ro
      - ./services/placement_test:/app/services/placement_test:ro
    depends_on:
      database:
        condition: service_healthy
      nllb:
        condition: service_healthy   # wait for NLLB's first-boot LoRA-merge + CT2 conversion
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/units')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - teach-network

  frontend:
    build: ./app
    container_name: teach-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # local access only — cloudflared routes externally
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - teach-network

  # ── Cloudflare Tunnel ───────────────────────────────────────────────────────
  # Routes external HTTPS traffic → http://teach-frontend:3000 (internal network)
  # No inbound ports needed — cloudflared connects outbound to Cloudflare's edge.
  #
  # Setup:
  #   1. Install cloudflared: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/downloads/
  #   2. Run: cloudflared tunnel login
  #   3. Run: cloudflared tunnel create teach
  #   4. Copy the tunnel token into .env as CLOUDFLARE_TUNNEL_TOKEN
  #   5. In Cloudflare dashboard, add a Public Hostname: yourdomain.com → http://teach-frontend:3000
  #   6. Uncomment this service and run: docker compose up -d cloudflared
  #
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: teach-cloudflared
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - frontend
  #   networks:
  #     - teach-network

  # ── Observability ───────────────────────────────────────────────────────────
  # Stack: OTel Collector → Tempo (traces) + Loki (logs) + Prometheus (metrics)
  #        Grafana ties everything together at http://localhost:3001
  #
  # Signals:
  #   Traces  — backend FastAPI/httpx/psycopg2 + frontend fetch/XHR
  #   Logs    — Python logging bridged via OTel → Loki
  #   Metrics — /metrics endpoint scraped by Prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: teach-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./services/observability/otel-collector.yml:/etc/otel/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC  (backend → collector)
      - "127.0.0.1:4318:4318"   # OTLP HTTP  (browser → collector, via nginx if needed)
    networks:
      - teach-network

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: teach-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./services/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # local only
    networks:
      - teach-network

  loki:
    image: grafana/loki:3.0.0
    container_name: teach-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./services/observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"   # local only
    networks:
      - teach-network

  tempo:
    image: grafana/tempo:2.5.0
    container_name: teach-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./services/observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"   # local only
    networks:
      - teach-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: teach-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./services/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"   # local only — access at http://localhost:3001
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - teach-network

volumes:
  huggingface-cache:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  teach-network:
    driver: bridge
