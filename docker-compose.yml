version: '3.8'

services:

  # ── AI Services ────────────────────────────────────────────────────────────

  qwen:
    image: vllm/vllm-openai:latest
    container_name: qwen-brain
    restart: unless-stopped
    ports:
      - "8010:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host
    command: >
      --model Qwen/Qwen2.5-7B-Instruct-AWQ
      --quantization awq
      --max-model-len 4096
      --gpu-memory-utilization 0.70
      --enforce-eager
      --port 8000
    networks:
      - teach-network

  nllb:
    build: ./services/nllb
    container_name: nllb-translator
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - C:/Users/pscad/Documents/somali-nllb-training/nllb-somali-english-v3:/app/model:ro
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host
    networks:
      - teach-network

  pronunciation:
    image: teach-pronunciation
    container_name: teach-pronunciation
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - teach-network

  kokoro:
    build: ./services/kokoro
    container_name: kokoro-tts
    restart: unless-stopped
    ports:
      - "8880:8880"
    environment:
      - USE_GPU=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - teach-network

  # ── Data ───────────────────────────────────────────────────────────────────

  database:
    image: postgres:16
    container_name: teach-database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/database/init-user-data-only.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teach-network

  # ── Application ────────────────────────────────────────────────────────────

  backend:
    build: ./backend
    container_name: teach-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=database
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - NLLB_URL=http://nllb-translator:8001/translate
      - QWEN_URL=http://qwen-brain:8000/v1/chat/completions
      - PRONUNCIATION_URL=http://teach-pronunciation:5002
      - KOKORO_URL=http://kokoro-tts:8880
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - ENVIRONMENT=production
    volumes:
      - ./backend/audio:/app/audio
      - ./backend/books:/app/books:ro
      - ./backend/unit-1:/app/unit-1:ro
      - ./backend/unit-2:/app/unit-2:ro
      - ./backend/unit-3:/app/unit-3:ro
      - ./backend/unit-4:/app/unit-4:ro
      - ./backend/unit-5:/app/unit-5:ro
      - ./backend/unit-6:/app/unit-6:ro
      - ./backend/unit-7:/app/unit-7:ro
      - ./backend/unit-8:/app/unit-8:ro
      - ./backend/unit-9:/app/unit-9:ro
      - ./backend/unit-10:/app/unit-10:ro
      - ./backend/unit-11:/app/unit-11:ro
      - ./backend/unit-12:/app/unit-12:ro
      - ./backend/unit-13:/app/unit-13:ro
      - ./backend/units.json:/app/units.json:ro
      - ./services/placement_test:/app/services/placement_test:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/units')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - teach-network

  frontend:
    build: ./app
    container_name: teach-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - teach-network

  # ── Observability ───────────────────────────────────────────────────────────
  # Stack: OTel Collector → Tempo (traces) + Loki (logs) + Prometheus (metrics)
  #        Grafana ties everything together at http://localhost:3001
  #
  # Signals:
  #   Traces  — backend FastAPI/httpx/psycopg2 + frontend fetch/XHR
  #   Logs    — Python logging bridged via OTel → Loki
  #   Metrics — /metrics endpoint scraped by Prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: teach-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./services/observability/otel-collector.yml:/etc/otel/config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC  (backend → collector)
      - "4318:4318"   # OTLP HTTP  (browser → collector)
    networks:
      - teach-network

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: teach-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./services/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - teach-network

  loki:
    image: grafana/loki:3.0.0
    container_name: teach-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./services/observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - teach-network

  tempo:
    image: grafana/tempo:2.5.0
    container_name: teach-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./services/observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - teach-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: teach-grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./services/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"   # app uses 3000, so Grafana is on 3001
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - teach-network

volumes:
  huggingface-cache:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  teach-network:
    driver: bridge
