# version: '3.8'

services:

  # ── AI Services ────────────────────────────────────────────────────────────

  # The chat "brain" (AI tutor / conversation) now runs on a hosted, FREE
  # OpenAI-compatible LLM via OpenRouter — see the backend service's QWEN_URL /
  # QWEN_MODEL / OPENROUTER_API_KEY below and docs/curriculum-architecture.md.
  # No local GPU model is needed for chat anymore.
  #
  # To run the chat brain locally instead (offline / no external API), uncomment
  # this service and set QWEN_URL=http://qwen-brain:8000/v1/chat/completions on
  # the backend (leave OPENROUTER_API_KEY unset). Needs ~4 GB VRAM.
  #
  # qwen:
  #   image: vllm/vllm-openai:latest
  #   container_name: qwen-brain
  #   restart: unless-stopped
  #   ports:
  #     - "8010:8000"
  #   volumes:
  #     - huggingface-cache:/root/.cache/huggingface
  #   environment:
  #     - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   ipc: host
  #   command: >
  #     --model Qwen/Qwen2.5-3B-Instruct-AWQ
  #     --quantization awq
  #     --max-model-len 2048
  #     --gpu-memory-utilization 0.25
  #     --enforce-eager
  #     --port 8000
  #   networks:
  #     - teach-network

  # NLLB (Somali↔English translation) — RETIRED from the runtime path (2026-09).
  # The tutor now translates via a single folded OpenRouter call (no GPU); NLLB is
  # no longer needed at runtime and the standalone /api/translate endpoint is unused
  # by the frontend. Kept out of production to free the GPU. The full service
  # definition (GPU + CT2 int8 + LoRA volume) is in git history — restore it there
  # (and re-add NLLB_URL + the backend depends_on) to revive for offline baking or
  # other projects. See docs/translation-model-decision.md.

  # Pronunciation (speech scoring) — disabled in Docker to avoid pulling a multi-GB
  # CUDA + PyTorch image. Run it natively instead, reusing the torch/CUDA already on
  # your machine:
  #     cd services/audio
  #     pip install -r requirements-pronunciation.txt   # torch NOT included — uses yours
  #     python pronunciation_service.py                 # serves on 0.0.0.0:5002
  # The backend reaches it via PRONUNCIATION_URL (defaults to host.docker.internal
  # below). To run it in Docker instead, uncomment this service and set the backend's
  # PRONUNCIATION_URL back to http://teach-pronunciation:5002.
  #
  # pronunciation:
  #   build: ./services/audio   # builds the local image; `image:` just names/tags it
  #   image: teach-pronunciation
  #   container_name: teach-pronunciation
  #   restart: unless-stopped
  #   ports:
  #     - "5002:5002"
  #   environment:
  #     - NVIDIA_VISIBLE_DEVICES=all
  #     - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  #     - PYTHONUNBUFFERED=1
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   networks:
  #     - teach-network

  # Kokoro (TTS) — RETIRED (2026-09). Text-to-speech now uses OpenRouter's free
  # flux-tts (primary) with edge-tts as the keyless fallback — no local model, no
  # GPU (see core/speech.py + TTS_* in .env). Full service definition is in git
  # history if you ever want a self-hosted TTS again.

  # ── Data ───────────────────────────────────────────────────────────────────

  database:
    image: postgres:16
    container_name: teach-database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/database/init-user-data-only.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teach-network

  # ── Application ────────────────────────────────────────────────────────────

  backend:
    build: ./backend
    container_name: teach-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # local access only — frontend nginx proxies internally
    environment:
      - DB_HOST=database
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      # Chat brain: hosted free OpenRouter model by default (values from .env, with
      # cloud defaults). To use the local qwen container instead, set
      # QWEN_URL=http://qwen-brain:8000/v1/chat/completions and uncomment that service.
      - QWEN_URL=${QWEN_URL:-https://openrouter.ai/api/v1/chat/completions}
      - QWEN_MODEL=${QWEN_MODEL:-inclusionai/ling-3.0-flash-sante:free}
      - LLM_FALLBACK_MODELS=${LLM_FALLBACK_MODELS:-minimax/minimax-m3:free,liquid/lfm-2.5-2.6b:free}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Pronunciation runs natively on the host by default (see the commented-out
      # service above). host.docker.internal lets this container reach it. Set to
      # http://teach-pronunciation:5002 if you re-enable the Docker service.
      - PRONUNCIATION_URL=${PRONUNCIATION_URL:-http://host.docker.internal:5002}
      # Folded tutor (chat/explain) — OpenRouter, no GPU. See docs/translation-model-decision.md.
      - FOLDED_MODEL=${FOLDED_MODEL:-deepseek/deepseek-v4-flash-0731}
      - FOLDED_FALLBACK_MODEL=${FOLDED_FALLBACK_MODEL:-nex-agi/nex-n2.5-pro:free}
      - LLM_DAILY_SPEND_CAP_USD=${LLM_DAILY_SPEND_CAP_USD:-5.0}
      - TUTOR_FREE_DAILY_LIMIT=${TUTOR_FREE_DAILY_LIMIT:-25}
      - TUTOR_PAID_DAILY_LIMIT=${TUTOR_PAID_DAILY_LIMIT:-500}
      # Text-to-speech — OpenRouter flux-tts primary, edge-tts fallback (no GPU).
      - TTS_MODEL=${TTS_MODEL:-deepgram/flux-tts:free}
      - TTS_FLUX_VOICE=${TTS_FLUX_VOICE:-flux-alexis-en}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - ENVIRONMENT=production
    volumes:
      - ./backend/audio:/app/audio
      - ./backend/books:/app/books:ro
      - ./backend/readers:/app/readers:ro
      - ./backend/unit-1:/app/unit-1:ro
      - ./backend/unit-2:/app/unit-2:ro
      - ./backend/unit-3:/app/unit-3:ro
      - ./backend/unit-4:/app/unit-4:ro
      - ./backend/unit-5:/app/unit-5:ro
      - ./backend/unit-6:/app/unit-6:ro
      - ./backend/unit-7:/app/unit-7:ro
      - ./backend/unit-8:/app/unit-8:ro
      - ./backend/unit-9:/app/unit-9:ro
      - ./backend/unit-10:/app/unit-10:ro
      - ./backend/unit-11:/app/unit-11:ro
      - ./backend/unit-12:/app/unit-12:ro
      - ./backend/unit-13:/app/unit-13:ro
      - ./backend/units.json:/app/units.json:ro
      - ./services/placement_test:/app/services/placement_test:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/units')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - teach-network

  frontend:
    build: ./app
    container_name: teach-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # local access only — cloudflared routes externally
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - teach-network

  # ── Cloudflare Tunnel ───────────────────────────────────────────────────────
  # Routes external HTTPS traffic → http://teach-frontend:3000 (internal network)
  # No inbound ports needed — cloudflared connects outbound to Cloudflare's edge.
  #
  # Setup:
  #   1. Install cloudflared: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/downloads/
  #   2. Run: cloudflared tunnel login
  #   3. Run: cloudflared tunnel create teach
  #   4. Copy the tunnel token into .env as CLOUDFLARE_TUNNEL_TOKEN
  #   5. In Cloudflare dashboard, add a Public Hostname: yourdomain.com → http://teach-frontend:3000
  #   6. Put the tunnel token in .env as CLOUDFLARE_TUNNEL_TOKEN, then start it with:
  #      docker compose --profile tunnel up -d
  # It's behind the "tunnel" profile so a plain `docker compose up` does NOT start it
  # (avoids a restart loop when the token is unset). Add the profile flag to expose.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: teach-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - teach-network

  # ── Observability ───────────────────────────────────────────────────────────
  # Stack: OTel Collector → Tempo (traces) + Loki (logs) + Prometheus (metrics)
  #        Grafana ties everything together at http://localhost:3001
  #
  # Signals:
  #   Traces  — backend FastAPI/httpx/psycopg2 + frontend fetch/XHR
  #   Logs    — Python logging bridged via OTel → Loki
  #   Metrics — /metrics endpoint scraped by Prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: teach-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./services/observability/otel-collector.yml:/etc/otel/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC  (backend → collector)
      - "127.0.0.1:4318:4318"   # OTLP HTTP  (browser → collector, via nginx if needed)
    networks:
      - teach-network

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: teach-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./services/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # local only
    networks:
      - teach-network

  loki:
    image: grafana/loki:3.0.0
    container_name: teach-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./services/observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"   # local only
    networks:
      - teach-network

  tempo:
    image: grafana/tempo:2.5.0
    container_name: teach-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./services/observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"   # local only
    networks:
      - teach-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: teach-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./services/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"   # local only — access at http://localhost:3001
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - teach-network

volumes:
  huggingface-cache:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  teach-network:
    driver: bridge
