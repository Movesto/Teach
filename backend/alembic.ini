[alembic]
# sqlalchemy.url is set dynamically in env.py from environment variables.
# Do not hardcode credentials here.
script_location = alembic

# Naming convention for auto-generated migration files
file_template = %%(rev)s_%%(slug)s

# Timezone for timestamps in migration files
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
