name: CI

# Trigger on PRs and pushes to master.
# pull_request (not pull_request_target) is intentional — it runs in the
# context of the PR branch, never with elevated write access, so untrusted
# code cannot exfiltrate secrets or poison the pipeline.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Deny all permissions at the workflow level; each job grants only what it needs.
permissions: {}

jobs:
  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    permissions:
      contents: read  # checkout only

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        # Pinned to commit SHA for supply-chain safety (actions/checkout v4.2.2).
        # persist-credentials: false drops the ephemeral token after checkout so
        # later steps cannot accidentally push or call the GitHub API.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node
        # Pinned to commit SHA (actions/setup-node v4.1.0).
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint & syntax check
    runs-on: ubuntu-latest

    permissions:
      contents: read  # checkout only

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        # Pinned to commit SHA (actions/setup-python v5.3.0).
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Install ruff (linter)
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check backend/

      - name: Syntax check
        # Catches import errors and obvious runtime-startup failures.
        run: python -c "import ast, pathlib; [ast.parse(f.read_text()) for f in pathlib.Path('backend').glob('**/*.py')]"
