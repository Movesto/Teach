services:
  nllb:
    build: ./nllb
    container_name: nllb-translator
    ports:
      - "8001:8001"
    volumes:
      # Mount your trained model
      - C:/Users/pscad/Documents/somali-nllb-training/nllb-somali-english-v3:/app/model:ro
      # Cache for base model download
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host

volumes:
  huggingface-cache:
